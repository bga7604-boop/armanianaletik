<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#090d12">
<title>ARMANI ANALETIK</title>

<style>
:root{
    --bg:#080b10;
    --panel:#10161e;
    --panel2:#151d27;
    --green:#2ee676;
    --green2:#18b85a;
    --gold:#f5c451;
    --white:#f7f9fb;
    --muted:#84909d;
    --line:#222c38;
    --danger:#ff5d6c;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

body{
    background:
        radial-gradient(circle at 50% -10%,rgba(46,230,118,.13),transparent 35%),
        var(--bg);
    color:var(--white);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    min-height:100vh;
    padding-bottom:82px;
}

/* =========================
   INTRO
========================= */

#intro{
    position:fixed;
    inset:0;
    z-index:9999;
    background:#080b10;
    display:flex;
    justify-content:center;
    align-items:center;
    transition:.7s ease;
}

#intro.hide{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

.intro-box{
    width:90%;
    max-width:380px;
    text-align:center;
}

.logo{
    width:110px;
    height:110px;
    margin:auto;
    border-radius:28px;
    background:#0e1511;
    border:2px solid var(--green);
    box-shadow:
        0 0 35px rgba(46,230,118,.22),
        inset 0 0 25px rgba(46,230,118,.06);
    display:flex;
    align-items:center;
    justify-content:center;
    animation:logoPulse 2s infinite;
}

.logo svg{
    width:72px;
    height:72px;
}

@keyframes logoPulse{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.05)}
}

.intro-title{
    margin-top:24px;
    font-size:25px;
    font-weight:900;
    letter-spacing:2px;
}

.intro-sub{
    margin-top:7px;
    color:var(--muted);
    font-size:12px;
    letter-spacing:1px;
}

.loader{
    width:42px;
    height:42px;
    margin:30px auto 0;
    border:3px solid rgba(46,230,118,.15);
    border-top-color:var(--green);
    border-radius:50%;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

/* =========================
   HEADER
========================= */

header{

    top:0;
    z-index:100;
    width:100%;
    background:rgba(8,11,16,.9);
    backdrop-filter:blur(18px);
    border-bottom:1px solid var(--line);
}
