<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Armani Analetik</title>
    
    <style>
        :root {
            --bg: #0d1017;
            --card: #181d28;
            --card-modal: #1e2433;
            --accent: #2ecc71;
            --gold: #ffb703;
            --text: #ffffff;
            --subtext: #8b98a5;
            --border: #283042;
            --input-bg: #293042;
            --red: #e74c3c;
            --black: #2c3e50;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: var(--bg); 
            color: var(--text); 
            margin: 0; 
            padding: 0 0 80px 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }

        /* 🔝 HEADER */
        header { 
            background: #141822; width: 100%; padding: 12px 16px; 
            border-bottom: 1px solid var(--border); display: flex;
            align-items: center; justify-content: space-between;
            position: relative; z-index: 100;
        }
        
        .header-left { display: flex; align-items: center; gap: 10px; }
        .logo-svg { width: 34px; height: 34px; }
        .header-title-box h1 { margin: 0; font-size: 14px; font-weight: 800; color: var(--text); }
        .header-title-box p { margin: 1px 0 0; color: var(--subtext); font-size: 10px; }

        .auth-buttons { display: flex; align-items: center; gap: 8px; }
        .btn-login { background: transparent; color: var(--gold); border: 1px solid var(--gold); padding: 7px 12px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; }
        .btn-register { background: var(--gold); color: #000000; border: 1px solid var(--gold); padding: 7px 12px; border-radius: 8px; font-size: 12px; font-weight: 800; cursor: pointer; }

        /* ПРОФИЛЬ */
        .user-top-bar { display: flex; align-items: center; gap: 10px; position: relative; }
        .header-user-name { font-size: 14px; font-weight: 700; color: #ffffff; }
        .user-avatar-btn { width: 38px; height: 38px; border-radius: 8px; overflow: hidden; cursor: pointer; border: 1px solid var(--border); }
        .user-avatar-btn img { width: 100%; height: 100%; object-fit: cover; }
        
        /* МОДАЛЬДАР (АВТОРИЗАЦИЯ) */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); z-index: 1000; display: none; justify-content: center; align-items: center; padding: 15px; }
        .modal-card { background: var(--card-modal); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 360px; padding: 20px; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .modal-close { position: absolute; top: 15px; right: 15px; background: none; border: none; color: var(--subtext); font-size: 20px; cursor: pointer; }
        .input-group { margin-bottom: 12px; text-align: left; }
        .input-group label { display: block; font-size: 13px; color: #fff; margin-bottom: 8px; font-weight: 600; }
        .input-group input { width: 100%; padding: 12px; background: var(--input-bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 14px; outline: none; }
        .btn-submit { width: 100%; background: #333a4d; color: #8892a4; border: none; padding: 14px; border-radius: 10px; font-weight: 800; font-size: 14px; cursor: pointer; margin-top: 10px; }
        .btn-submit.active { background: var(--gold); color: #000; }

        /* НЕГІЗГІ КОНТЕНТ & БЕТТЕР */
        .container { max-width: 500px; width: 92%; margin: 20px 0; display: flex; flex-direction: column; gap: 15px; }
        .page { display: none; width: 100%; animation: fadeIn 0.3s ease; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .card { background: var(--card); padding: 20px; border-radius: 14px; border: 1px solid var(--border); text-align: center; }
        .card-title { font-size: 18px; margin: 0 0 10px 0; color: var(--accent); display: flex; justify-content: center; align-items: center; gap: 8px; }
        
        /* УАҚЫТ ЖӘНЕ СІЛТЕМЕ */
        .time-display { font-size: 32px; font-weight: 800; color: #fff; margin: 10px 0; letter-spacing: 2px; }
        .time-label { font-size: 12px; color: var(--subtext); text-transform: uppercase; }
        
        .link-box { display: flex; align-items: center; background: var(--input-bg); border-radius: 8px; padding: 5px; border: 1px solid var(--border); margin-top: 15px; }
        .link-box input { flex: 1; background: transparent; border: none; color: var(--subtext); padding: 8px 10px; font-size: 13px; outline: none; }
        .btn-copy { background: var(--accent); color: #000; border: none; padding: 8px 15px; border-radius: 6px; font-weight: 700; font-size: 12px; cursor: pointer; }

        /* РУЛЕТКА */
        .roulette-wrapper { width: 100%; overflow: hidden; border-radius: 10px; border: 2px solid var(--border); position: relative; background: #000; height: 80px; margin: 20px 0; }
        .roulette-selector { position: absolute; left: 50%; top: 0; bottom: 0; width: 4px; background: var(--gold); z-index: 10; transform: translateX(-50%); box-shadow: 0 0 10px var(--gold); }
        .roulette-track { display: flex; height: 100%; transition: transform 4s cubic-bezier(0.1, 0.8, 0.1, 1); }
        .roulette-item { min-width: 60px; height: 100%; display: flex; justify-content: center; align-items: center; font-weight: 800; font-size: 18px; color: #fff; border-right: 1px solid rgba(0,0,0,0.5); }
        .item-red { background: var(--red); }
        .item-black { background: var(--black); }
        .item-green { background: var(--accent); }
        .btn-spin { background: var(--gold); color: #000; border: none; padding: 14px 30px; border-radius: 10px; font-weight: 800; font-size: 16px; cursor: pointer; width: 100%; }

        /* ТӨМЕНГІ НАВИГАЦИЯ */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: #141822; border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; z-index: 100; padding-bottom: env(safe-area-inset-bottom); }
        .nav-item { color: var(--subtext); text-decoration: none; font-size: 13px; font-weight: 700; background: none; border: none; cursor: pointer; padding: 10px; }
        .nav-item.active { color: var(--accent); }

    </style>
</head>
<body>

<!-- 🔝 HEADER -->
<header>
    <div class="header-left">
        <svg class="logo-svg" viewBox="0 0 100 100">
            <rect width="100" height="100" rx="20" fill="#121613" stroke="#2ecc71" stroke-width="4"/>
            <path d="M25 75 L42 25 L58 25 L40 75 Z" fill="#2ecc71"/>
            <path d="M42 25 L75 75 L60 75 L50 58 L62 58 L54 44 Z" fill="#f1c40f"/>
        </svg>
        <div class="header-title-box">
            <h1>ARMANI ANALETIK</h1>
            <p>Минимализм & Аналитика</p>
        </div>
    </div>
    <div id="auth-buttons-container">
        <div class="auth-buttons">
            <button class="btn-login" onclick="openStep1()">Кіру</button>
            <button class="btn-register" onclick="openStep1()">Тіркелу</button>
        </div>
    </div>
</header>

<!-- МОДАЛЬ: АВТОРИЗАЦИЯ -->
<div class="modal-overlay" id="modalStep1">
    <div class="modal-card">
        <button class="modal-close" onclick="closeAllModals()">✕</button>
        <h2 style="color:#fff; margin-top:0;">Кіру</h2>
        <div class="input-group">
            <label>Аккаунт аты</label>
            <input type="text" id="emailInput" placeholder="Атыңызды енгізіңіз" oninput="toggleStep1Btn()">
        </div>
        <button class="btn-submit" id="btnNext" onclick="finishLogin()" disabled>Кіру</button>
    </div>
</div>

<!-- 📄 НЕГІЗГІ КОНТЕНТ -->
<div class="container">
    
    <!-- 1. БАСТЫ БЕТ -->
    <div id="page-home" class="page active">
        <div class="card">
            <h2 class="card-title">🎯 Armani Analetik Басты Беті</h2>
            <p style="color: var(--subtext); font-size: 13px;">Сайтқа қош келдіңіз!</p>
        </div>

        <div class="card" style="margin-top: 15px;">
            <div class="time-label">Ағымдағы уақыт (Астана)</div>
            <div class="time-display" id="live-clock">00:00:00</div>
        </div>

        <div class="card" style="margin-top: 15px;">
            <h3 style="color:#fff; margin:0 0 10px 0; font-size:15px; text-align:left;">🔗 Сіздің шақыру сілтемеңіз</h3>
            <div class="link-box">
                <input type="text" id="ref-link" value="https://armanianaletik.kz/ref/777" readonly>
                <button class="btn-copy" onclick="copyLink()">Көшіру</button>
            </div>
        </div>
    </div>

    <!-- 2. VIP ЗОНА -->
    <div id="page-vip" class="page">
        <div class="card">
            <h2 class="card-title">👑 VIP Зона</h2>
            <p style="color: var(--subtext); font-size: 14px; margin-top:15px;">Бұл бөлім тек VIP жазылымы бар қолданушыларға қолжетімді.</p>
        </div>
    </div>

    <!-- 3. РУЛЕТКА -->
    <div id="page-roulette" class="page">
        <div class="card">
            <h2 class="card-title">🎰 Рулетка</h2>
            <div class="roulette-wrapper">
                <div class="roulette-selector"></div>
                <div class="roulette-track" id="rouletteTrack">
                    <!-- Javascript арқылы толтырылады -->
                </div>
            </div>
            <button class="btn-spin" onclick="spinRoulette()" id="spinBtn">Айналдыру</button>
        </div>
    </div>

</div>

<!-- 🧭 ТӨМЕНГІ НАВИГАЦИЯ -->
<nav class="bottom-nav">
    <button class="nav-item active" onclick="switchPage('page-home', this)">Басты бет</button>
    <button class="nav-item" onclick="switchPage('page-vip', this)">VIP Зона</button>
    <button class="nav-item" onclick="switchPage('page-roulette', this)">Рулетка</button>
</nav>

<script>
    // --- АВТОРИЗАЦИЯ ЛОГИКАСЫ ---
    window.addEventListener('load', () => {
        checkSavedUser();
        initRoulette();
    });

    function openStep1() { document.getElementById('modalStep1').style.display = 'flex'; }
    function closeAllModals() { document.getElementById('modalStep1').style.display = 'none'; }
    function toggleStep1Btn() {
        const val = document.getElementById('emailInput').value;
        const btn = document.getElementById('btnNext');
        if(val.length > 2) { btn.classList.add('active'); btn.disabled = false; } 
        else { btn.classList.remove('active'); btn.disabled = true; }
    }
    function finishLogin() {
        const username = document.getElementById('emailInput').value || "Пайдаланушы";
        localStorage.setItem('user_logged', 'true');
        localStorage.setItem('user_name', username);
        renderLoggedInUser(username);
        closeAllModals();
    }
    function checkSavedUser() {
        if(localStorage.getItem('user_logged') === 'true') {
            renderLoggedInUser(localStorage.getItem('user_name'));
        }
    }
    function renderLoggedInUser(username) {
        const avatarImg = "https://api.dicebear.com/7.x/bottts/svg?seed=" + username;
        document.getElementById('auth-buttons-container').innerHTML = `
            <div class="user-top-bar">
                <span class="header-user-name">${username}</span>
                <div class="user-avatar-btn" onclick="logout()" title="Шығу үшін басыңыз">
                    <img src="${avatarImg}" alt="Avatar">
                </div>
            </div>
        `;
    }
    function logout() {
        if(confirm("Аккаунттан шығасыз ба?")) {
            localStorage.removeItem('user_logged');
            location.reload();
        }
    }

    // --- БЕТТЕРДІ АУЫСТЫРУ ---
    function switchPage(pageId, btnElement) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
        btnElement.classList.add('active');
    }

    // --- УАҚЫТТЫ КӨРСЕТУ ---
    setInterval(() => {
        const now = new Date();
        document.getElementById('live-clock').innerText = now.toLocaleTimeString('kk-KZ');
    }, 1000);

    // --- СІЛТЕМЕ КӨШІРУ ---
    function copyLink() {
        const copyText = document.getElementById("ref-link");
        copyText.select();
        document.execCommand("copy");
        alert("Сілтеме көшірілді: " + copyText.value);
    }

    // --- РУЛЕТКА ОЙЫНЫ ---
    const track = document.getElementById('rouletteTrack');
    const order = [0, 32, 15, 19, 4, 21, 2, 25, 17, 34, 6, 27, 13, 36, 11, 30, 8, 23, 10, 5, 24, 16, 33, 1, 20, 14, 31, 9, 22, 18, 29, 7, 28, 12, 35, 3, 26];
    const itemWidth = 60; 
    let isSpinning = false;

    function initRoulette() {
        // Тректі ұзын етіп толтыру (айналғанда бітпеуі үшін 5 копия)
        let html = '';
        for(let j=0; j<5; j++) {
            order.forEach(num => {
                let colorClass = 'item-black';
                if(num === 0) colorClass = 'item-green';
                else if ([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36].includes(num)) colorClass = 'item-red';
                html += `<div class="roulette-item ${colorClass}">${num}</div>`;
            });
        }
        track.innerHTML = html;
        // Бастапқы позиция
        track.style.transform = `translateX(0px)`;
    }

    function spinRoulette() {
        if(isSpinning) return;
        isSpinning = true;
        const btn = document.getElementById('spinBtn');
        btn.style.opacity = '0.5';
        
        // Кездейсоқ ұзындыққа айналдыру (3-ші немесе 4-ші блокқа дейін)
        const baseSpins = order.length * 3; // кем дегенде 3 рет толық айналу
        const randomTarget = Math.floor(Math.random() * order.length);
        const totalItemsToMove = baseSpins + randomTarget;
        
        // Экран ортасына түсуі үшін есептеу
        const trackOffset = (totalItemsToMove * itemWidth) - (track.parentElement.offsetWidth / 2) + (itemWidth / 2);
        
        track.style.transition = 'transform 4s cubic-bezier(0.1, 0.8, 0.1, 1)';
        track.style.transform = `translateX(-${trackOffset}px)`;

        setTimeout(() => {
            isSpinning = false;
            btn.style.opacity = '1';
            // Анимация біткен соң тректі бастапқы орнына білдіртпей қайтару логикасын қосуға болады, бірақ бұл қарапайым нұсқа.
        }, 4000);
    }
</script>
</body>
</html>
