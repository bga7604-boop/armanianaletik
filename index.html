<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App UI</title>
  
  <!-- Canvas Confetti Library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.1);
      --neon-glow: 0 0 15px rgba(99, 102, 241, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* Glassmorphism Card Wrapper */
    .container {
      width: 100%;
      max-width: 450px;
      padding: 24px;
      animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      transition: all 0.3s ease;
      margin-bottom: 16px;
    }

    .glass-card:hover {
      border-color: rgba(99, 102, 241, 0.4);
      box-shadow: var(--neon-glow);
    }

    /* Ripple & Hover Button */
    .btn-action {
      width: 100%;
      background: linear-gradient(90deg, #6366f1, #8b5cf6);
      border: none;
      color: white;
      padding: 14px 24px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.2s ease;
      margin-top: 10px;
    }

    .btn-action:hover {
      box-shadow: 0 0 20px rgba(139, 92, 246, 0.6);
    }

    .btn-action:active {
      transform: scale(0.96);
    }

    /* Page Fade Animation */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Skeleton Loading Effect */
    .skeleton {
      height: 20px;
      margin-bottom: 10px;
      background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.15) 50%, rgba(255,255,255,0.05) 75%);
      background-size: 200% 100%;
      animation: loading 1.5s infinite;
      border-radius: 8px;
    }

    @keyframes loading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- UI Карточкасы -->
    <div class="glass-card">
      <h2 style="margin-bottom: 12px;">Басқару панелі</h2>
      <p style="color: #cbd5e1; font-size: 14px; margin-bottom: 16px;">
        Жаңартылған Neon & Glassmorphism интерфейсі.
      </p>

      <!-- Skeleton Жүктелу визуализациясы -->
      <div id="loader" style="display: none;">
        <div class="skeleton" style="width: 100%;"></div>
        <div class="skeleton" style="width: 70%;"></div>
      </div>

      <!-- Іс-әрекет батырмасы -->
      <button class="btn-action" onclick="handleWin()">Жеңісті іске қосу 🎉</button>
    </div>
  </div>

  <script>
    // Confetti Анимациясын іске қосу
    function handleWin() {
      // Loader визуализациясы (микро-интеракция)
      const loader = document.getElementById('loader');
      loader.style.display = 'block';

      setTimeout(() => {
        loader.style.display = 'none';
        
        // Салтанатты конфетти шашу
        confetti({
          particleCount: 120,
          spread: 80,
          origin: { y: 0.6 },
          colors: ['#6366f1', '#8b5cf6', '#ec4899', '#10b981']
        });
      }, 400);
    }
  </script>

</body>
</html>
