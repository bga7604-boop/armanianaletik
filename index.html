<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Armani Analetik</title>
    
    <style>
        :root {
            --bg: #0d1017;
            --card: #181d28;
            --card-modal: #1e2433;
            --accent: #2ecc71;
            --gold: #ffb703;
            --text: #ffffff;
            --subtext: #8b98a5;
            --border: #283042;
            --input-bg: #293042;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: var(--bg); 
            color: var(--text); 
            margin: 0; 
            padding: 0 0 80px 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }

        /* 🔝 HEADER */
        header { 
            background: #141822; width: 100%; padding: 10px 16px; 
            border-bottom: 1px solid var(--border); display: flex;
            align-items: center; justify-content: space-between;
            position: relative; z-index: 100;
        }
        
        .header-left { display: flex; align-items: center; gap: 10px; }
        .logo-svg { width: 34px; height: 34px; }
        .header-title-box h1 { margin: 0; font-size: 13px; font-weight: 800; color: var(--text); }
        .header-sub-row { display: flex; align-items: center; gap: 8px; margin-top: 2px; }
        .header-sub-row p { margin: 0; color: var(--subtext); font-size: 10px; }
        
        /* ⏰ ХЕДЕРДЕГІ УАҚЫТ */
        .header-clock { 
            background: rgba(46, 204, 113, 0.1); 
            color: var(--accent); 
            padding: 2px 6px; 
            border-radius: 4px; 
            font-size: 10px; 
            font-weight: 700; 
            border: 1px solid rgba(46, 204, 113, 0.3);
        }

        .auth-buttons { display: flex; align-items: center; gap: 8px; }
        .btn-login { background: transparent; color: var(--gold); border: 1px solid var(--gold); padding: 6px 10px; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; }
        .btn-register { background: var(--gold); color: #000000; border: 1px solid var(--gold); padding: 6px 10px; border-radius: 8px; font-size: 11px; font-weight: 800; cursor: pointer; }

        .user-top-bar { display: flex; align-items: center; gap: 8px; }
        .header-user-name { font-size: 13px; font-weight: 700; color: #ffffff; }
        .user-avatar-btn { width: 34px; height: 34px; border-radius: 8px; overflow: hidden; cursor: pointer; border: 1px solid var(--border); }
        .user-avatar-btn img { width: 100%; height: 100%; object-fit: cover; }

        /* МОДАЛЬДАР */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); z-index: 1000; display: none; justify-content: center; align-items: center; padding: 15px; }
        .modal-card { background: var(--card-modal); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 360px; padding: 20px; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; }
        .modal-close { position: absolute; top: 15px; right: 15px; background: none; border: none; color: var(--subtext); font-size: 20px; cursor: pointer; }
        .input-group { margin-bottom: 12px; text-align: left; }
        .input-group label { display: block; font-size: 12px; color: #fff; margin-bottom: 6px; font-weight: 600; }
        .input-group input { width: 100%; padding: 10px; background: var(--input-bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 13px; outline: none; }
        .btn-submit { width: 100%; background: #333a4d; color: #8892a4; border: none; padding: 12px; border-radius: 10px; font-weight: 800; font-size: 13px; cursor: pointer; margin-top: 10px; }
        .btn-submit.active { background: var(--gold); color: #000; }

        /* КОНТЕНТ */
        .container { max-width: 500px; width: 92%; margin: 15px 0; display: flex; flex-direction: column; gap: 12px; }
        .page { display: none; width: 100%; animation: fadeIn 0.3s ease; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .card { background: var(--card); padding: 18px; border-radius: 14px; border: 1px solid var(--border); text-align: center; }
        .card-title { font-size: 16px; margin: 0 0 8px 0; color: var(--accent); display: flex; justify-content: center; align-items: center; gap: 8px; }

        /* 🎁 БҰҒІНГІ КОНКУРС БАННЕРІ */
        .contest-banner {
            background: rgba(46, 204, 113, 0.05);
            border: 1px solid var(--accent);
            border-radius: 14px;
            padding: 12px;
            text-align: center;
        }
        .contest-banner h3 { margin: 0; font-size: 15px; color: var(--accent); }
        .contest-banner p { margin: 4px 0 0; font-size: 12px; color: var(--subtext); }

        /* 🎡 ДӨҢГЕЛЕК РУЛЕТКА ДИЗАЙНЫ */
        .wheel-box {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 20px auto;
        }
        .wheel-pointer {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 22px solid #ffffff;
            z-index: 20;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }
        .wheel-canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 5px solid var(--accent);
            box-shadow: 0 0 20px rgba(46, 204, 113, 0.4);
            transition: transform 4s cubic-bezier(0.15, 0.85, 0.15, 1);
        }
        .wheel-center-logo {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 50px; height: 50px;
            background: #121613;
            border: 3px solid var(--gold);
            border-radius: 50%;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-spin-green { 
            background: var(--accent); 
            color: #000; 
            border: none; 
            padding: 12px 25px; 
            border-radius: 10px; 
            font-weight: 800; 
            font-size: 15px; 
            cursor: pointer; 
            width: 100%; 
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.3); 
        }

        /* 🔗 ШАҚЫРУ СІЛТЕМЕСІ */
        .link-box { display: flex; align-items: center; background: var(--input-bg); border-radius: 8px; padding: 4px; border: 1px solid var(--border); margin-top: 10px; }
        .link-box input { flex: 1; background: transparent; border: none; color: var(--subtext); padding: 8px 10px; font-size: 12px; outline: none; }
        .btn-copy { background: var(--accent); color: #000; border: none; padding: 8px 14px; border-radius: 6px; font-weight: 800; font-size: 12px; cursor: pointer; }

        /* NAV */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: #141822; border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; z-index: 100; }
        .nav-item { color: var(--subtext); text-decoration: none; font-size: 12px; font-weight: 700; background: none; border: none; cursor: pointer; }
        .nav-item.active { color: var(--accent); }
    </style>
</head>
<body>

<!-- 🔝 HEADER -->
<header>
    <div class="header-left">
        <svg class="logo-svg" viewBox="0 0 100 100">
            <rect width="100" height="100" rx="20" fill="#121613" stroke="#2ecc71" stroke-width="4"/>
            <path d="M25 75 L42 25 L58 25 L40 75 Z" fill="#2ecc71"/>
            <path d="M42 25 L75 75 L60 75 L50 58 L62 58 L54 44 Z" fill="#f1c40f"/>
        </svg>
        <div class="header-title-box">
            <h1>ARMANI ANALETIK</h1>
            <div class="header-sub-row">
                <p>Минимализм & Аналитика</p>
                <div class="header-clock" id="header-clock">00:00:00</div>
            </div>
        </div>
    </div>
    <div id="auth-buttons-container">
        <div class="auth-buttons">
            <button class="btn-login" onclick="openStep1()">Кіру</button>
            <button class="btn-register" onclick="openStep1()">Тіркелу</button>
        </div>
    </div>
</header>

<!-- МОДАЛЬ: АВТОРИЗАЦИЯ -->
<div class="modal-overlay" id="modalStep1">
    <div class="modal-card">
        <button class="modal-close" onclick="closeAllModals()">✕</button>
        <h2 style="color:#fff; margin-top:0; font-size:18px;">Кіру</h2>
        <div class="input-group">
            <label>Аккаунт аты</label>
            <input type="text" id="emailInput" placeholder="Атыңызды енгізіңіз" oninput="toggleStep1Btn()">
        </div>
        <button class="btn-submit" id="btnNext" onclick="finishLogin()" disabled>Кіру</button>
    </div>
</div>

<!-- МОДАЛЬ: ТҮСКЕН НӘТИЖЕ -->
<div class="modal-overlay" id="modalResult">
    <div class="modal-card">
        <button class="modal-close" onclick="closeResultModal()">✕</button>
        <div style="font-size: 40px; margin-bottom: 10px;">🎉</div>
        <h2 style="color:var(--gold); margin:0 0 10px 0; font-size:20px;">Құттықтаймыз!</h2>
        <p style="color:#fff; font-size:15px;" id="resultText">Сіздің ұтысыңыз!</p>
        <button class="btn-submit active" onclick="closeResultModal()">Жабу</button>
    </div>
</div>

<!-- 📄 КОНТЕНТ -->
<div class="container">
    
    <!-- 1. БАСТЫ БЕТ -->
    <div id="page-home" class="page active">
        
        <!-- БҮГІНГІ КОНКУРС БАННЕРІ -->
        <div class="contest-banner">
            <h3>🎁 БҮГІНГІ КОНКУРС</h3>
            <p>Каналға өтіп, конкурсқа қатысыңыз! 🚀</p>
        </div>

        <!-- 🎡 ДӨҢГЕЛЕК СӘТТІЛІК РУЛЕТКАСЫ -->
        <div class="card">
            <h2 class="card-title" style="color:var(--accent);">🎯 СӘТТІЛІК РУЛЕТКАСЫ</h2>
            
            <div class="wheel-box">
                <div class="wheel-pointer"></div>
                <canvas class="wheel-canvas" id="wheelCanvas" width="300" height="300"></canvas>
                <div class="wheel-center-logo">
                    <svg width="24" height="24" viewBox="0 0 100 100">
                        <path d="M25 75 L42 25 L58 25 L40 75 Z" fill="#2ecc71"/>
                        <path d="M42 25 L75 75 L60 75 L50 58 L62 58 L54 44 Z" fill="#f1c40f"/>
                    </svg>
                </div>
            </div>
            
            <button class="btn-spin-green" onclick="spinWheel()" id="spinBtn">🎰 АЙНАЛДЫРУ</button>
        </div>

        <!-- 🔗 ШАҚЫРУ СІЛТЕМЕСІ -->
        <div class="card">
            <h3 style="color:#fff; margin:0; font-size:13px; text-align:left; display:flex; align-items:center; gap:6px;">
                🔗 Сіздің шақыру сілтемеңіз
            </h3>
            <div class="link-box">
                <input type="text" id="ref-link" value="https://armanianaletik.kz/ref/777" readonly>
                <button class="btn-copy" onclick="copyLink()">Көшіру</button>
            </div>
        </div>

    </div>

    <!-- 2. VIP ЗОНА -->
    <div id="page-vip" class="page">
        <div class="card">
            <h2 class="card-title">👑 VIP Зона</h2>
            <p style="color: var(--subtext); font-size: 13px; margin-top:10px;">Бұл бөлім тек VIP жазылымы бар қолданушыларға арналған.</p>
        </div>
    </div>

</div>

<!-- 🧭 ТӨМЕНГІ НАВИГАЦИЯ -->
<nav class="bottom-nav">
    <button class="nav-item active" onclick="switchPage('page-home', this)">Басты бет</button>
    <button class="nav-item" onclick="switchPage('page-vip', this)">VIP Зона</button>
</nav>

<script>
    // --- АВТОРИЗАЦИЯ ---
    window.addEventListener('load', () => {
        checkSavedUser();
        drawWheel();
    });

    function openStep1() { document.getElementById('modalStep1').style.display = 'flex'; }
    function closeAllModals() { document.getElementById('modalStep1').style.display = 'none'; }
    function closeResultModal() { document.getElementById('modalResult').style.display = 'none'; }

    function toggleStep1Btn() {
        const val = document.getElementById('emailInput').value;
        const btn = document.getElementById('btnNext');
        if(val.length > 2) { btn.classList.add('active'); btn.disabled = false; } 
        else { btn.classList.remove('active'); btn.disabled = true; }
    }

    function finishLogin() {
        const username = document.getElementById('emailInput').value || "Пайдаланушы";
        localStorage.setItem('user_logged', 'true');
        localStorage.setItem('user_name', username);
        renderLoggedInUser(username);
        closeAllModals();
    }

    function checkSavedUser() {
        if(localStorage.getItem('user_logged') === 'true') {
            renderLoggedInUser(localStorage.getItem('user_name'));
        }
    }

    function renderLoggedInUser(username) {
        const avatarImg = "https://api.dicebear.com/7.x/bottts/svg?seed=" + username;
        document.getElementById('auth-buttons-container').innerHTML = `
            <div class="user-top-bar">
                <span class="header-user-name">${username}</span>
                <div class="user-avatar-btn" onclick="logout()" title="Шығу">
                    <img src="${avatarImg}" alt="Avatar">
                </div>
            </div>
        `;
    }

    function logout() {
        if(confirm("Аккаунттан шығасыз ба?")) {
            localStorage.removeItem('user_logged');
            location.reload();
        }
    }

    function switchPage(pageId, btnElement) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
        btnElement.classList.add('active');
    }

    // УАҚЫТ
    setInterval(() => {
        const now = new Date();
        document.getElementById('header-clock').innerText = now.toLocaleTimeString('kk-KZ');
    }, 1000);

    function copyLink() {
        const copyText = document.getElementById("ref-link");
        copyText.select();
        document.execCommand("copy");
        alert("Сілтеме көшірілді: " + copyText.value);
    }

    // --- 🎡 СУРЕТТЕГІ РУЛЕТКА ПРИЗДАРЫ ЖӘНЕ САЛУ ---
    const prizes = [
        { text: "🏆 VIP Экспресс -10% 🔥", color: "#ffffff", textColor: "#000000" },
        { text: "👑 VIP Канал +1 Күн 👑", color: "#2ecc71", textColor: "#ffffff" },
        { text: "💸 VIP 15% Жеңілдік", color: "#181d28", textColor: "#ffffff" },
        { text: "🔄 Қайта Айналдыру", color: "#ffffff", textColor: "#000000" },
        { text: "💸 VIP 25% Жеңілдік", color: "#2ecc71", textColor: "#ffffff" },
        { text: "🎉 VIP +3 Күн 🌌", color: "#181d28", textColor: "#ffffff" },
        { text: "🏆 VIP Айлық +15 Күн", color: "#ffffff", textColor: "#000000" }
    ];

    const canvas = document.getElementById("wheelCanvas");
    const ctx = canvas.getContext("2d");
    const numPrizes = prizes.length;
    const arcSize = (2 * Math.PI) / numPrizes;
    let currentRotation = 0;
    let isSpinning = false;

    function drawWheel() {
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const radius = canvas.width / 2;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (let i = 0; i < numPrizes; i++) {
            const angle = i * arcSize;
            
            // Сектор салу
            ctx.beginPath();
            ctx.fillStyle = prizes[i].color;
            ctx.moveTo(centerX, centerY);
            ctx.arc(centerX, centerY, radius, angle, angle + arcSize);
            ctx.lineTo(centerX, centerY);
            ctx.fill();

            // Текст жазу
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(angle + arcSize / 2);
            ctx.textAlign = "right";
            ctx.fillStyle = prizes[i].textColor;
            ctx.font = "bold 11px -apple-system, Roboto, sans-serif";
            ctx.fillText(prizes[i].text, radius - 15, 4);
            ctx.restore();
        }
    }

    function spinWheel() {
        if (isSpinning) return;
        isSpinning = true;

        const btn = document.getElementById('spinBtn');
        btn.style.opacity = '0.5';

        // Кездейсоқ ұтыс
        const randomIndex = Math.floor(Math.random() * numPrizes);
        
        // Градустарды есептеу
        const degreesPerSegment = 360 / numPrizes;
        const targetDegree = 360 - (randomIndex * degreesPerSegment) - (degreesPerSegment / 2) - 90;
        const totalSpin = currentRotation + (360 * 5) + targetDegree;

        canvas.style.transform = `rotate(${totalSpin}deg)`;
        currentRotation = totalSpin;

        setTimeout(() => {
            isSpinning = false;
            btn.style.opacity = '1';
            
            // Ұтысты көрсету
            document.getElementById('resultText').innerHTML = `Ұтысыңыз: <br><b style="color:var(--accent); font-size:18px;">${prizes[randomIndex].text}</b>`;
            document.getElementById('modalResult').style.display = 'flex';
        }, 4000);
    }
</script>
</body>
</html>
