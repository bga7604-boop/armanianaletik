<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Armani Analetik</title>

    <!-- 🟢 FAVICON: "V" ӘРПІНІҢ ОРНЫНА САЙТ ЛОГОТИПІ -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23121613' stroke='%232ecc71' stroke-width='4'/><path d='M25 75 L42 25 L58 25 L40 75 Z' fill='%232ecc71'/><path d='M42 25 L75 75 L60 75 L50 58 L62 58 L54 44 Z' fill='%23f1c40f'/></svg>">
    
    <style>
        :root {
            --bg: #0d1017;
            --card: #181d28;
            --card-modal: #1e2433;
            --accent: #2ecc71;
            --gold: #ffb703;
            --text: #ffffff;
            --subtext: #8b98a5;
            --border: #283042;
            --input-bg: #293042;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: var(--bg); 
            color: var(--text); 
            margin: 0; 
            padding: 0 0 80px 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }

        /* 🔝 HEADER */
        header { 
            background: #141822; width: 100%; padding: 10px 16px; 
            border-bottom: 1px solid var(--border); display: flex;
            align-items: center; justify-content: space-between;
            position: relative; z-index: 100;
        }
        
        .header-left { display: flex; align-items: center; gap: 10px; }
        .logo-svg { width: 34px; height: 34px; }
        .header-title-box h1 { margin: 0; font-size: 13px; font-weight: 800; color: var(--text); }
        .header-sub-row { display: flex; align-items: center; gap: 8px; margin-top: 2px; }
        .header-sub-row p { margin: 0; color: var(--subtext); font-size: 10px; }
        
        /* ⏰ ХЕДЕРДЕГІ УАҚЫТ */
        .header-clock { 
            background: rgba(46, 204, 113, 0.1); 
            color: var(--accent); 
            padding: 2px 6px; 
            border-radius: 4px; 
            font-size: 10px; 
            font-weight: 700; 
            border: 1px solid rgba(46, 204, 113, 0.3);
        }

        .auth-buttons { display: flex; align-items: center; gap: 8px; }
        .btn-login { background: transparent; color: var(--gold); border: 1px solid var(--gold); padding: 6px 10px; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; }
        .btn-register { background: var(--gold); color: #000000; border: 1px solid var(--gold); padding: 6px 10px; border-radius: 8px; font-size: 11px; font-weight: 800; cursor: pointer; }

        .user-top-bar { display: flex; align-items: center; gap: 8px; }
        .header-user-name { font-size: 13px; font-weight: 700; color: #ffffff; }
        .user-avatar-btn { width: 34px; height: 34px; border-radius: 8px; overflow: hidden; cursor: pointer; border: 1px solid var(--border); }
        .user-avatar-btn img { width: 100%; height: 100%; object-fit: cover; }

        /* МОДАЛЬДАР */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); z-index: 1000; display: none; justify-content: center; align-items: center; padding: 15px; }
        .modal-card { background: var(--card-modal); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 360px; padding: 24px; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; transform: scale(0.9); animation: popUp 0.3s forwards ease-out; }
        @keyframes popUp { to { transform: scale(1); } }
        
        .modal-close { position: absolute; top: 15px; right: 15px; background: none; border: none; color: var(--subtext); font-size: 20px; cursor: pointer; }
        .input-group { margin-bottom: 12px; text-align: left; }
        .input-group label { display: block; font-size: 12px; color: #fff; margin-bottom: 6px; font-weight: 600; }
        .input-group input { width: 100%; padding: 10px; background: var(--input-bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 13px; outline: none; }
        .btn-submit { width: 100%; background: #333a4d; color: #8892a4; border: none; padding: 12px; border-radius: 10px; font-weight: 800; font-size: 13px; cursor: pointer; margin-top: 10px; }
        .btn-submit.active { background: var(--gold); color: #000; }

        /* КОНТЕНТ */
        .container { max-width: 500px; width: 92%; margin: 15px 0; display: flex; flex-direction: column; gap: 12px; }
        .page { display: none; width: 100%; animation: fadeIn 0.3s ease; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .card { background: var(--card); padding: 18px; border-radius: 14px; border: 1px solid var(--border); text-align: center; }
        .card-title { font-size: 16px; margin: 0 0 8px 0; color: var(--accent); display: flex; justify-content: center; align-items: center; gap: 8px; }

        /* 🎁 БҰҒІНГІ КОНКУРС БАННЕРІ */
        .contest-banner {
            background: rgba(46, 204, 113, 0.05);
            border: 1px solid var(--accent);
            border-radius: 14px;
            padding: 12px;
            text-align: center;
        }
        .contest-banner h3 { margin: 0; font-size: 15px; color: var(--accent); }
        .contest-banner p { margin: 4px 0 0; font-size: 12px; color: var(--subtext); }

        /* 🎡 HD ДӨҢГЕЛЕК РУЛЕТКА */
        .wheel-box {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 15px auto;
        }

        .wheel-pointer {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 0; height: 0;
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-top: 24px solid #ffffff;
            z-index: 20;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6));
            transition: transform 0.05s ease-in-out;
        }
        .wheel-pointer.bounce {
            transform: translateX(-50%) translateY(-3px) scaleY(0.9);
        }

        .wheel-canvas-container {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 5px solid var(--accent);
            box-shadow: 0 0 25px rgba(46, 204, 113, 0.4), inset 0 0 15px rgba(0,0,0,0.5);
            overflow: hidden;
            position: relative;
        }

        #wheelCanvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .wheel-center-logo {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 52px; height: 52px;
            background: #121613;
            border: 3px solid var(--gold);
            border-radius: 50%;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 10px rgba(0,0,0,0.8);
        }

        .btn-spin-green { 
            background: var(--accent); 
            color: #000; 
            border: none; 
            padding: 14px 25px; 
            border-radius: 12px; 
            font-weight: 800; 
            font-size: 15px; 
            cursor: pointer; 
            width: 100%; 
            box-shadow: 0 4px 15px rgba(46, 204, 113, 0.3); 
            transition: transform 0.1s, opacity 0.2s, background-color 0.3s;
        }
        .btn-spin-green:disabled {
            background: #2a3447;
            color: var(--subtext);
            box-shadow: none;
            cursor: not-allowed;
        }
        .btn-spin-green:not(:disabled):active { transform: scale(0.98); }

        /* 🔗 ШАҚЫРУ СІЛТЕМЕСІ */
        .link-box { display: flex; align-items: center; background: var(--input-bg); border-radius: 8px; padding: 4px; border: 1px solid var(--border); margin-top: 10px; }
        .link-box input { flex: 1; background: transparent; border: none; color: var(--subtext); padding: 8px 10px; font-size: 12px; outline: none; }
        .btn-copy { background: var(--accent); color: #000; border: none; padding: 8px 14px; border-radius: 6px; font-weight: 800; font-size: 12px; cursor: pointer; }

        /* NAV */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: #141822; border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; z-index: 100; }
        .nav-item { color: var(--subtext); text-decoration: none; font-size: 12px; font-weight: 700; background: none; border: none; cursor: pointer; }
        .nav-item.active { color: var(--accent); }
    </style>
</head>
<body>

<!-- 🔝 HEADER -->
<header>
    <div class="header-left">
        <svg class="logo-svg" viewBox="0 0 100 100">
            <rect width="100" height="100" rx="20" fill="#121613" stroke="#2ecc71" stroke-width="4"/>
            <path d="M25 75 L42 25 L58 25 L40 75 Z" fill="#2ecc71"/>
            <path d="M42 25 L75 75 L60 75 L50 58 L62 58 L54 44 Z" fill="#f1c40f"/>
        </svg>
        <div class="header-title-box">
            <h1>ARMANI ANALETIK</h1>
            <div class="header-sub-row">
                <p>Минимализм & Аналитика</p>
                <div class="header-clock" id="header-clock">00:00:00</div>
            </div>
        </div>
    </div>
    <div id="auth-buttons-container">
        <div class="auth-buttons">
            <button class="btn-login" onclick="openStep1()">Кіру</button>
            <button class="btn-register" onclick="openStep1()">Тіркелу</button>
        </div>
    </div>
</header>

<!-- МОДАЛЬ: АВТОРИЗАЦИЯ -->
<div class="modal-overlay" id="modalStep1">
    <div class="modal-card">
        <button class="modal-close" onclick="closeAllModals()">✕</button>
        <h2 style="color:#fff; margin-top:0; font-size:18px;">Кіру</h2>
        <div class="input-group">
            <label>Аккаунт аты</label>
            <input type="text" id="emailInput" placeholder="Атыңызды енгізіңіз" oninput="toggleStep1Btn()">
        </div>
        <button class="btn-submit" id="btnNext" onclick="finishLogin()" disabled>Кіру</button>
    </div>
</div>

<!-- МОДАЛЬ: ТҮСКЕН НӘТИЖЕ -->
<div class="modal-overlay" id="modalResult">
    <div class="modal-card">
        <button class="modal-close" onclick="closeResultModal()">✕</button>
        <div style="font-size: 46px; margin-bottom: 10px;">🎉</div>
        <h2 style="color:var(--gold); margin:0 0 10px 0; font-size:22px; font-weight:800;">ҚҰТТЫҚТАЙМЫЗ!</h2>
        <p style="color:#fff; font-size:16px; line-height: 1.4;" id="resultText">Сіздің ұтысыңыз!</p>
        <button class="btn-submit active" onclick="closeResultModal()" style="font-size: 14px; padding: 14px;">ҰТЫСТЫ АЛУ 🚀</button>
    </div>
</div>

<!-- 📄 КОНТЕНТ -->
<div class="container">
    
    <!-- 1. БАСТЫ БЕТ -->
    <div id="page-home" class="page active">
        
        <!-- БҮГІНГІ КОНКУРС БАННЕРІ -->
        <div class="contest-banner">
            <h3>🎁 БҮГІНГІ КОНКУРС</h3>
            <p>Каналға өтіп, конкурсқа қатысыңыз! 🚀</p>
        </div>

        <!-- 🎡 HD ДӨҢГЕЛЕК РУЛЕТКА -->
        <div class="card">
            <h2 class="card-title" style="color:var(--accent);">🎯 СӘТТІЛІК РУЛЕТКАСЫ</h2>
            
            <div class="wheel-box">
                <div class="wheel-pointer" id="wheelPointer"></div>
                <div class="wheel-canvas-container">
                    <canvas id="wheelCanvas" width="600" height="600"></canvas>
                </div>
                <div class="wheel-center-logo">
                    <svg width="26" height="26" viewBox="0 0 100 100">
                        <path d="M25 75 L42 25 L58 25 L40 75 Z" fill="#2ecc71"/>
                        <path d="M42 25 L75 75 L60 75 L50 58 L62 58 L54 44 Z" fill="#f1c40f"/>
                    </svg>
                </div>
            </div>
            
            <!-- 🎰 БАТЫРМА (24САҒАТ ТАЙМЕРІ БАР) -->
            <button class="btn-spin-green" onclick="spinWheel()" id="spinBtn">🎰 АЙНАЛДЫРУ</button>
        </div>

        <!-- 🔗 ШАҚЫРУ СІЛТЕМЕСІ -->
        <div class="card">
            <h3 style="color:#fff; margin:0; font-size:13px; text-align:left; display:flex; align-items:center; gap:6px;">
                🔗 Сіздің шақыру сілтемеңіз
            </h3>
            <div class="link-box">
                <input type="text" id="ref-link" value="https://armanianaletik.kz/ref/777" readonly>
                <button class="btn-copy" onclick="copyLink()">Көшіру</button>
            </div>
        </div>

    </div>

    <!-- 2. VIP ЗОНА -->
    <div id="page-vip" class="page">
        <div class="card">
            <h2 class="card-title">👑 VIP Зона</h2>
            <p style="color: var(--subtext); font-size: 13px; margin-top:10px;">Бұл бөлім тек VIP жазылымы бар қолданушыларға арналған.</p>
        </div>
    </div>

</div>

<!-- 🧭 ТӨМЕНГІ НАВИГАЦИЯ -->
<nav class="bottom-nav">
    <button class="nav-item active" onclick="switchPage('page-home', this)">Басты бет</button>
    <button class="nav-item" onclick="switchPage('page-vip', this)">VIP Зона</button>
</nav>

<script>
    // --- 🔊 ДЫБЫСТАР СИНТЕЗАТОРЫ ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new AudioContext();
        }
    }

    function playClickSound() {
        try {
            if (!audioCtx) initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.04);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.04);
        } catch(e){}
    }

    function playWinSound() {
        try {
            if (!audioCtx) initAudio();
            const notes = [261.63, 329.63, 392.00, 523.25];
            notes.forEach((freq, index) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime + index * 0.08);
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime + index * 0.08);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + index * 0.08 + 0.4);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(audioCtx.currentTime + index * 0.08);
                osc.stop(audioCtx.currentTime + index * 0.08 + 0.4);
            });
        } catch(e){}
    }

    // --- БЕТ ЖҮКТЕЛГЕНДЕ ---
    window.addEventListener('load', () => {
        checkSavedUser();
        drawWheel();
        checkCooldownTimer();
    });

    function openStep1() { document.getElementById('modalStep1').style.display = 'flex'; }
    function closeAllModals() { document.getElementById('modalStep1').style.display = 'none'; }
    function closeResultModal() { document.getElementById('modalResult').style.display = 'none'; }

    function toggleStep1Btn() {
        const val = document.getElementById('emailInput').value;
        const btn = document.getElementById('btnNext');
        if(val.length > 2) { btn.classList.add('active'); btn.disabled = false; } 
        else { btn.classList.remove('active'); btn.disabled = true; }
    }

    function finishLogin() {
        const username = document.getElementById('emailInput').value || "Пайдаланушы";
        localStorage.setItem('user_logged', 'true');
        localStorage.setItem('user_name', username);
        renderLoggedInUser(username);
        closeAllModals();
    }

    function checkSavedUser() {
        if(localStorage.getItem('user_logged') === 'true') {
            renderLoggedInUser(localStorage.getItem('user_name'));
        }
    }

    function renderLoggedInUser(username) {
        const avatarImg = "https://api.dicebear.com/7.x/bottts/svg?seed=" + username;
        document.getElementById('auth-buttons-container').innerHTML = `
            <div class="user-top-bar">
                <span class="header-user-name">${username}</span>
                <div class="user-avatar-btn" onclick="logout()" title="Шығу">
                    <img src="${avatarImg}" alt="Avatar">
                </div>
            </div>
        `;
    }

    function logout() {
        if(confirm("Аккаунттан шығасыз ба?")) {
            localStorage.removeItem('user_logged');
            location.reload();
        }
    }

    function switchPage(pageId, btnElement) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
        btnElement.classList.add('active');
    }

    // ХЕДЕРДЕГІ САТ ТАЙМЕРІ
    setInterval(() => {
        const now = new Date();
        document.getElementById('header-clock').innerText = now.toLocaleTimeString('kk-KZ');
    }, 1000);

    function copyLink() {
        const copyText = document.getElementById("ref-link");
        copyText.select();
        document.execCommand("copy");
        alert("Сілтеме көшірілді: " + copyText.value);
    }

    // --- ⏳ 24 САҒАТТЫҚ ШЕКТЕУ ТАЙМЕРІ (COOLDOWN) ---
    let cooldownInterval = null;

    function checkCooldownTimer() {
        const nextSpinTime = localStorage.getItem('nextSpinTime');
        const spinBtn = document.getElementById('spinBtn');

        if (nextSpinTime) {
            const now = Date.now();
            const diff = parseInt(nextSpinTime) - now;

            if (diff > 0) {
                spinBtn.disabled = true;
                updateTimerText(diff);
                clearInterval(cooldownInterval);
                cooldownInterval = setInterval(() => {
                    const currentDiff = parseInt(nextSpinTime) - Date.now();
                    if (currentDiff <= 0) {
                        clearInterval(cooldownInterval);
                        localStorage.removeItem('nextSpinTime');
                        spinBtn.disabled = false;
                        spinBtn.innerText = '🎰 АЙНАЛДЫРУ';
                    } else {
                        updateTimerText(currentDiff);
                    }
                }, 1000);
            } else {
                localStorage.removeItem('nextSpinTime');
                spinBtn.disabled = false;
                spinBtn.innerText = '🎰 АЙНАЛДЫРУ';
            }
        }
    }

    function updateTimerText(diff) {
        const hours = Math.floor(diff / (1000 * 60 * 60));
        const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((diff % (1000 * 60)) / 1000);

        const hStr = hours < 10 ? '0' + hours : hours;
        const mStr = minutes < 10 ? '0' + minutes : minutes;
        const sStr = seconds < 10 ? '0' + seconds : seconds;

        document.getElementById('spinBtn').innerText = `⏳ КЕЛЕСІ АЙНАЛДЫРУ: ${hStr}:${mStr}:${sStr}`;
    }

    function start24hCooldown() {
        const twentyFourHours = 24 * 60 * 60 * 1000;
        const targetTime = Date.now() + twentyFourHours;
        localStorage.setItem('nextSpinTime', targetTime);
        checkCooldownTimer();
    }

    // --- 🎡 HD РУЛЕТКА ДИЗАЙНЫ МЕН АНИМАЦИЯСЫ ---
    const prizes = [
        { text: "🏆 VIP Экспресс -10% 🔥", color: "#ffffff", textColor: "#000000" },
        { text: "👑 VIP Канал +1 Күн 👑", color: "#2ecc71", textColor: "#ffffff" },
        { text: "💸 VIP 15% Жеңілдік", color: "#181d28", textColor: "#ffffff" },
        { text: "🔄 Қайта Айналдыру", color: "#ffffff", textColor: "#000000" },
        { text: "💸 VIP 25% Жеңілдік", color: "#2ecc71", textColor: "#ffffff" },
        { text: "🎉 VIP +3 Күн 🌌", color: "#181d28", textColor: "#ffffff" },
        { text: "🏆 VIP Айлық +15 Күн", color: "#ffffff", textColor: "#000000" }
    ];

    const canvas = document.getElementById("wheelCanvas");
    const ctx = canvas.getContext("2d");
    const numPrizes = prizes.length;
    const arcSize = (2 * Math.PI) / numPrizes;
    
    let currentAngle = 0;
    let isSpinning = false;

    function drawWheel() {
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const radius = canvas.width / 2;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (let i = 0; i < numPrizes; i++) {
            const angle = currentAngle + (i * arcSize);
            
            ctx.beginPath();
            ctx.fillStyle = prizes[i].color;
            ctx.moveTo(centerX, centerY);
            ctx.arc(centerX, centerY, radius, angle, angle + arcSize);
            ctx.lineTo(centerX, centerY);
            ctx.fill();

            ctx.strokeStyle = "rgba(0,0,0,0.15)";
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate(angle + arcSize / 2);
            ctx.textAlign = "right";
            ctx.fillStyle = prizes[i].textColor;
            ctx.font = "bold 22px -apple-system, BlinkMacSystemFont, Roboto, sans-serif";
            ctx.fillText(prizes[i].text, radius - 30, 8);
            ctx.restore();
        }
    }

    function spinWheel() {
        if (isSpinning) return;
        
        // 24 сағаттық уақыт тексеру
        const nextSpinTime = localStorage.getItem('nextSpinTime');
        if (nextSpinTime && parseInt(nextSpinTime) > Date.now()) {
            alert("Айналдыру 24 сағатта 1 рет қана қолжетімді!");
            return;
        }

        initAudio();
        isSpinning = true;

        const btn = document.getElementById('spinBtn');
        const pointer = document.getElementById('wheelPointer');
        btn.disabled = true;

        const winIndex = Math.floor(Math.random() * numPrizes);
        const targetSectorAngle = (2 * Math.PI) - (winIndex * arcSize) - (arcSize / 2) - (Math.PI / 2);
        const extraRotations = 5 * (2 * Math.PI);
        
        const startAngle = currentAngle;
        const totalRotation = startAngle + extraRotations + (targetSectorAngle - (startAngle % (2 * Math.PI)));
        
        const duration = 5000;
        const startTime = performance.now();
        
        let lastSectorIndex = -1;

        function animateWheel(now) {
            const elapsed = now - startTime;
            const progress = Math.min(elapsed / duration, 1);
            
            const easeOut = 1 - Math.pow(1 - progress, 3);
            currentAngle = startAngle + (totalRotation - startAngle) * easeOut;
            drawWheel();

            const normalizedAngle = (Math.PI * 2.5 - currentAngle) % (Math.PI * 2);
            const positiveAngle = normalizedAngle < 0 ? normalizedAngle + Math.PI * 2 : normalizedAngle;
            const currentSectorIndex = Math.floor(positiveAngle / arcSize) % numPrizes;

            if (currentSectorIndex !== lastSectorIndex) {
                lastSectorIndex = currentSectorIndex;
                playClickSound();
                
                pointer.classList.add('bounce');
                setTimeout(() => pointer.classList.remove('bounce'), 40);
            }

            if (progress < 1) {
                requestAnimationFrame(animateWheel);
            } else {
                isSpinning = false;
                playWinSound();
                
                // 🚀 Айналдыру аяқталған соң 24 сағаттық таймерді іске қосу
                start24hCooldown();
                
                setTimeout(() => {
                    document.getElementById('resultText').innerHTML = `Сіздің ұтысыңыз: <br><br><b style="color:var(--accent); font-size:20px; background: rgba(46,204,113,0.1); padding: 8px 12px; border-radius: 8px; border: 1px solid var(--accent); display: inline-block;">${prizes[winIndex].text}</b>`;
                    document.getElementById('modalResult').style.display = 'flex';
                }, 300);
            }
        }

        requestAnimationFrame(animateWheel);
    }
</script>
