<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Armani Analetik.kz</title>
    <style>
        :root {
            --bg: #0a0c0a;
            --card: #121613;
            --accent: #2ecc71;
            --text: #ffffff;
            --subtext: #8a9a8e;
            --border: #1e2620;
            --gold: #f1c40f;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: var(--bg); 
            color: var(--text); 
            margin: 0; 
            padding: 0 0 80px 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }

        header { 
            background: var(--card); 
            width: 100%; 
            text-align: center; 
            padding: 20px 0; 
            border-bottom: 1px solid var(--border); 
        }
        header h1 { margin: 0; font-size: 22px; font-weight: 800; color: var(--text); letter-spacing: 1px; }
        header p { margin: 4px 0 0; color: var(--subtext); font-size: 13px; }

        .container { max-width: 500px; width: 92%; margin: 15px 0; }
        .card { 
            background: var(--card); 
            padding: 20px; 
            border-radius: 14px; 
            margin-bottom: 15px; 
            border: 1px solid var(--border); 
        }

        /* ⏱️ Таймер */
        .timer-box {
            background: rgba(46, 204, 113, 0.05);
            border: 1px solid var(--accent);
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            margin-bottom: 15px;
        }
        .timer-title { font-size: 12px; color: var(--subtext); text-transform: uppercase; letter-spacing: 1px; }
        .timer-clock { font-size: 24px; font-weight: 800; color: var(--accent); margin-top: 4px; font-family: monospace; }

        .btn { 
            display: block; 
            background: var(--accent); 
            color: #000000; 
            padding: 15px; 
            text-decoration: none; 
            border-radius: 10px; 
            font-weight: 800; 
            text-align: center; 
            margin-top: 10px; 
            font-size: 15px; 
            border: none; 
            width: 100%; 
            cursor: pointer; 
        }
        .btn:active { opacity: 0.8; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* 🎡 Анық көрінетін SVG Рулетка контейнері */
        .wheel-wrapper {
            position: relative;
            width: 320px;
            height: 320px;
            margin: 15px auto;
            border-radius: 50%;
            border: 6px solid var(--accent);
            box-shadow: 0 0 30px rgba(46, 204, 113, 0.3);
            background: #000;
        }
        
        /* Меңзер */
        .wheel-pointer {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-top: 24px solid #ffffff;
            z-index: 30;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
        }

        /* Ортадағы Ықшам Қара Лента */
        .wheel-center-ribbon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 65px;
            height: 65px;
            background: #0c0f0d;
            border-radius: 50%;
            border: 3px solid var(--gold);
            z-index: 20;
            box-shadow: 0 0 10px rgba(241, 196, 15, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gold);
            font-size: 9px;
            font-weight: 900;
            text-align: center;
            line-height: 1.1;
            pointer-events: none;
        }

        .wheel-svg {
            width: 100%;
            height: 100%;
            transform-origin: center center;
            transition: transform 4s cubic-bezier(0.15, 0.9, 0.15, 1);
        }

        /* Мәтін стилі */
        .sector-text {
            font-size: 13.5px;
            font-weight: 800;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-anchor: middle;
            dominant-baseline: central;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 60px;
            background: var(--card);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }
        .nav-item { color: var(--subtext); text-decoration: none; font-size: 12px; font-weight: 600; background: none; border: none; }
        .nav-item.active { color: var(--accent); }
    </style>
</head>
<body>

<header>
    <h1>ARMANI ANALETIK</h1>
    <p>Минимализм & Аналитика</p>
</header>

<div class="container">

    <div class="timer-box">
        <div class="timer-title">⏱️ Келесі айналдыруға дейін:</div>
        <div class="timer-clock" id="countdown-timer">23:59:59</div>
    </div>

    <div class="card" style="text-align: center;">
        <h2 style="font-size: 18px; margin: 0 0 10px 0; color: var(--accent);">🎯 СӘТТІЛІК РУЛЕТКАСЫ</h2>

        <div class="wheel-wrapper">
            <div class="wheel-pointer"></div>
            <div class="wheel-center-ribbon">ARMANI<br>ANALETIK</div>

            <!-- SVG арқылы салынған анық 7 сектор -->
            <svg class="wheel-svg" id="wheel" viewBox="0 0 500 500">
                <g id="sectors-group"></g>
            </svg>
        </div>

        <audio id="spin-sound" src="https://cdn.pixabay.com/audio/2022/03/15/audio_2c9d81d6d6.mp3" preload="auto"></audio>
        <audio id="win-sound" src="https://cdn.pixabay.com/audio/2023/10/16/audio_d0b57e4e67.mp3" preload="auto"></audio>

        <button id="spin-btn" onclick="spinWheel()" class="btn">🎰 АЙНАЛДЫРУ</button>

        <div id="win-result-box" style="display: none; margin-top: 15px; background: rgba(46,204,113,0.1); border: 1px solid var(--accent); padding: 12px; border-radius: 8px;">
            <div style="font-size: 12px; color: var(--subtext);">Сіздің жүлдеңіз:</div>
            <div id="win-prize-text" style="font-size: 18px; font-weight: 800; color: var(--accent); margin: 5px 0;">—</div>
            <a href="https://t.me/analetik_1" class="btn" style="background: #ffffff; color: #000;">ЖҮЛДЕНІ АЛУ (TELEGRAM)</a>
        </div>
    </div>

</div>

<nav class="bottom-nav">
    <button class="nav-item active">Басты бет</button>
    <button class="nav-item">VIP Зона</button>
    <button class="nav-item">Рулетка</button>
</nav>

<script>
    // ⏱️ Таймер
    function startTimer() {
        let totalSeconds = 24 * 3600 - 1;
        const timerElement = document.getElementById('countdown-timer');
        setInterval(() => {
            let hours = Math.floor(totalSeconds / 3600);
            let minutes = Math.floor((totalSeconds % 3600) / 60);
            let seconds = totalSeconds % 60;

            hours = hours < 10 ? '0' + hours : hours;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            seconds = seconds < 10 ? '0' + seconds : seconds;

            timerElement.innerText = `${hours}:${minutes}:${seconds}`;
            if (totalSeconds > 0) totalSeconds--;
            else totalSeconds = 24 * 3600;
        }, 1000);
    }
    startTimer();

    // 🎡 7 ЖҮЛДЕ ЖӘНЕ ТҮСТЕРІ
    const prizes = [
        { text: "VIP Экспресс -10% 🔥", bg: "#ffffff", color: "#000000" },
        { text: "VIP Канал +1 Күн 👑", bg: "#2ecc71", color: "#000000" },
        { text: "VIP 15% Жеңілдік 💎", bg: "#121613", color: "#ffffff" },
        { text: "Қайта Айналдыру 🔄", bg: "#ffffff", color: "#000000" },
        { text: "VIP 25% Жеңілдік 🚀", bg: "#2ecc71", color: "#000000" },
        { text: "VIP +3 Күн 🎉", bg: "#121613", color: "#ffffff" },
        { text: "VIP Айлық +15 Күн 🏆", bg: "#ffffff", color: "#000000" }
    ];

    // SVG Секторларын генерациялау (Мәтіндер анық әрі ортада болуы үшін)
    function buildWheel() {
        const group = document.getElementById('sectors-group');
        const numSectors = prizes.length;
        const arc = 360 / numSectors;
        const radius = 245;
        const centerX = 250;
        const centerY = 250;

        prizes.forEach((prize, i) => {
            const startAngle = i * arc - 90;
            const endAngle = startAngle + arc;

            const startRad = (startAngle * Math.PI) / 180;
            const endRad = (endAngle * Math.PI) / 180;

            const x1 = centerX + radius * Math.cos(startRad);
            const y1 = centerY + radius * Math.sin(startRad);
            const x2 = centerX + radius * Math.cos(endRad);
            const y2 = centerY + radius * Math.sin(endRad);

            const pathData = `M ${centerX} ${centerY} L ${x1} ${y1} A ${radius} ${radius} 0 0 1 ${x2} ${y2} Z`;

            // Сектор сызу
            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            path.setAttribute("d", pathData);
            path.setAttribute("fill", prize.bg);
            path.setAttribute("stroke", "rgba(0,0,0,0.15)");
            path.setAttribute("stroke-width", "2");
            group.appendChild(path);

            // Мәтінді ортаға орналастыру және бұру
            const midAngle = startAngle + arc / 2;
            const textRad = (midAngle * Math.PI) / 180;
            const textDist = 145; // Мәтіннің радиустағы орны (анық көрінетін жерде)
            const textX = centerX + textDist * Math.cos(textRad);
            const textY = centerY + textDist * Math.sin(textRad);

            const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
            text.setAttribute("x", textX);
            text.setAttribute("y", textY);
            text.setAttribute("fill", prize.color);
            text.setAttribute("class", "sector-text");
            text.setAttribute("transform", `rotate(${midAngle + 90}, ${textX}, ${textY})`);
            text.textContent = prize.text;

            group.appendChild(text);
        });
    }

    buildWheel();

    // 🎡 Айналдыру функциясы
    let isSpinning = false;
    let currentRotation = 0;

    function spinWheel() {
        if (isSpinning) return;

        isSpinning = true;
        const btn = document.getElementById('spin-btn');
        btn.disabled = true;
        document.getElementById('win-result-box').style.display = 'none';

        const spinSound = document.getElementById('spin-sound');
        const winSound = document.getElementById('win-sound');

        spinSound.currentTime = 0;
        spinSound.play().catch(() => {});

        const numSectors = prizes.length;
        const arc = 360 / numSectors;
        
        // Кездейсоқ жүлде таңдау
        const prizeIndex = Math.floor(Math.random() * numSectors);
        const selectedPrize = prizes[prizeIndex];

        // Толық 5 айналым + жүлдені меңзерге дәл әкелу
        const targetSectorAngle = (prizeIndex * arc) + (arc / 2);
        const targetDegree = 360 - targetSectorAngle;

        currentRotation += (360 * 5) + (targetDegree - (currentRotation % 360));

        document.getElementById('wheel').style.transform = `rotate(${currentRotation}deg)`;

        setTimeout(() => {
            isSpinning = false;
            btn.disabled = false;

            spinSound.pause();
            winSound.currentTime = 0;
            winSound.play().catch(() => {});

            document.getElementById('win-prize-text').innerText = selectedPrize.text;
            document.getElementById('win-result-box').style.display = 'block';
        }, 4000);
    }
</script>
</body>
</html>
