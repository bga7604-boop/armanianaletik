<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Armani Analetik.kz</title>
    <style>
        :root {
            --bg: #0a0c0a;
            --card: #121613;
            --accent: #2ecc71;
            --text: #ffffff;
            --subtext: #8a9a8e;
            --border: #1e2620;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: var(--bg); 
            color: var(--text); 
            margin: 0; 
            padding: 0 0 80px 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }

        header { 
            background: var(--card); 
            width: 100%; 
            text-align: center; 
            padding: 20px 0; 
            border-bottom: 1px solid var(--border); 
        }
        header h1 { margin: 0; font-size: 22px; font-weight: 800; color: var(--text); letter-spacing: 1px; }
        header p { margin: 4px 0 0; color: var(--subtext); font-size: 13px; }

        .container { max-width: 500px; width: 92%; margin: 15px 0; }
        .card { 
            background: var(--card); 
            padding: 20px; 
            border-radius: 14px; 
            margin-bottom: 15px; 
            border: 1px solid var(--border); 
        }

        /* ⏱️ Таймер */
        .timer-box {
            background: rgba(46, 204, 113, 0.05);
            border: 1px solid var(--accent);
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            margin-bottom: 15px;
        }
        .timer-title { font-size: 12px; color: var(--subtext); text-transform: uppercase; letter-spacing: 1px; }
        .timer-clock { font-size: 24px; font-weight: 800; color: var(--accent); margin-top: 4px; font-family: monospace; }

        .btn { 
            display: block; 
            background: var(--accent); 
            color: #000000; 
            padding: 15px; 
            text-decoration: none; 
            border-radius: 10px; 
            font-weight: 800; 
            text-align: center; 
            margin-top: 10px; 
            font-size: 15px; 
            border: none; 
            width: 100%; 
            cursor: pointer; 
        }
        .btn:active { opacity: 0.8; }

        /* 🎡 7 Секторлы Рулетка */
        .wheel-wrapper {
            position: relative;
            width: 320px;
            height: 320px;
            margin: 15px auto;
            border-radius: 50%;
            border: 6px solid var(--accent);
            box-shadow: 0 0 25px rgba(46, 204, 113, 0.25);
            overflow: hidden;
            background: #000;
        }
        .wheel-pointer {
            position: absolute;
            top: 0px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 32px;
            color: var(--accent);
            z-index: 10;
        }
        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: relative;
            transition: transform 4s cubic-bezier(0.15, 0.9, 0.15, 1);
        }
        .wheel-sec {
            position: absolute;
            width: 50%;
            height: 50%;
            transform-origin: 100% 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(0, 0, 0, 0.3);
        }
        .wheel-sec span {
            position: absolute;
            left: 10px;
            bottom: 30px;
            font-size: 11px;
            font-weight: 800;
            transform: rotate(25deg);
            white-space: nowrap;
            letter-spacing: 0.3px;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 60px;
            background: var(--card);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        .nav-item { color: var(--subtext); text-decoration: none; font-size: 12px; font-weight: 600; background: none; border: none; }
        .nav-item.active { color: var(--accent); }
    </style>
</head>
<body>

<header>
    <h1>ARMANI ANALETIK</h1>
    <p>Минимализм & Аналитика</p>
</header>

<div class="container">

    <div class="timer-box">
        <div class="timer-title">⏱️ Келесі айналдыруға дейін:</div>
        <div class="timer-clock" id="countdown-timer">23:59:59</div>
    </div>

    <div class="card" style="text-align: center;">
        <h2 style="font-size: 18px; margin: 0 0 10px 0; color: var(--accent);">🎯 СӘТТІЛІК РУЛЕТКАСЫ</h2>

        <div class="wheel-wrapper">
            <div class="wheel-pointer">▼</div>
            <div class="wheel" id="wheel">
                <!-- 7 ЖАҢА ЖҮЛДЕ СЕКТОРЫ -->
                <div class="wheel-sec" style="transform: rotate(0deg) skewY(-38.57deg); background: #ffffff; color: #000;"><span>VIP Экспресс -10% 🔥</span></div>
                <div class="wheel-sec" style="transform: rotate(51.43deg) skewY(-38.57deg); background: #121613; color: #fff;"><span>VIP Канал +1 Күн 👑</span></div>
                <div class="wheel-sec" style="transform: rotate(102.86deg) skewY(-38.57deg); background: #2ecc71; color: #000;"><span>VIP 15% Жеңілдік 💎</span></div>
                <div class="wheel-sec" style="transform: rotate(154.29deg) skewY(-38.57deg); background: #ffffff; color: #000;"><span>Қайта Айналдыру 🔄</span></div>
                <div class="wheel-sec" style="transform: rotate(205.71deg) skewY(-38.57deg); background: #121613; color: #fff;"><span>VIP 25% Жеңілдік 🚀</span></div>
                <div class="wheel-sec" style="transform: rotate(257.14deg) skewY(-38.57deg); background: #2ecc71; color: #000;"><span>VIP +3 Күн 🎉</span></div>
                <div class="wheel-sec" style="transform: rotate(308.57deg) skewY(-38.57deg); background: #ffffff; color: #000;"><span>VIP Айлық +15 Күн 🏆</span></div>
            </div>
        </div>

        <button id="spin-btn" onclick="spinWheel()" class="btn">🎰 АЙНАЛДЫРУ</button>

        <div id="win-result-box" style="display: none; margin-top: 15px; background: rgba(46,204,113,0.1); border: 1px solid var(--accent); padding: 12px; border-radius: 8px;">
            <div style="font-size: 12px; color: var(--subtext);">Сіздің жүлдеңіз:</div>
            <div id="win-prize-text" style="font-size: 18px; font-weight: 800; color: var(--accent); margin: 5px 0;">—</div>
            <a href="https://t.me/analetik_1" class="btn" style="background: #ffffff; color: #000;">ЖҮЛДЕНІ АЛУ (TELEGRAM)</a>
        </div>
    </div>

</div>

<nav class="bottom-nav">
    <button class="nav-item active">Басты бет</button>
    <button class="nav-item">VIP Зона</button>
    <button class="nav-item">Рулетка</button>
</nav>

<script>
    function startTimer() {
        let totalSeconds = 24 * 3600 - 1;
        const timerElement = document.getElementById('countdown-timer');

        setInterval(() => {
            let hours = Math.floor(totalSeconds / 3600);
            let minutes = Math.floor((totalSeconds % 3600) / 60);
            let seconds = totalSeconds % 60;

            hours = hours < 10 ? '0' + hours : hours;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            seconds = seconds < 10 ? '0' + seconds : seconds;

            timerElement.innerText = `${hours}:${minutes}:${seconds}`;

            if (totalSeconds > 0) {
                totalSeconds--;
            } else {
                totalSeconds = 24 * 3600;
            }
        }, 1000);
    }
    startTimer();

    let isSpinning = false;
    let currentRotation = 0;

    function spinWheel() {
        if (isSpinning) return;

        isSpinning = true;
        const btn = document.getElementById('spin-btn');
        btn.disabled = true;
        btn.style.opacity = '0.5';

        document.getElementById('win-result-box').style.display = 'none';

        // 7 ЖҮЛДЕНІҢ ОРТА СЕРЕДИНАСЫНА СӘЙКЕС ГРАДУСТАР
        const prizes = [
            { text: "VIP Экспресс -10% 🔥", deg: 25.7 },
            { text: "VIP Канал +1 Күн 👑", deg: 77.1 },
            { text: "VIP 15% Жеңілдік 💎", deg: 128.5 },
            { text: "Қайта Айналдыру 🔄", deg: 180.0 },
            { text: "VIP 25% Жеңілдік 🚀", deg: 231.4 },
            { text: "VIP +3 Күн 🎉", deg: 282.8 },
            { text: "VIP Айлық +15 Күн 🏆", deg: 334.2 }
        ];

        const randomPrize = prizes[Math.floor(Math.random() * prizes.length)];
        currentRotation += (360 * 5) + (360 - (currentRotation % 360)) + randomPrize.deg;

        document.getElementById('wheel').style.transform = `rotate(${currentRotation}deg)`;

        setTimeout(() => {
            isSpinning = false;
            btn.disabled = false;
            btn.style.opacity = '1';
            document.getElementById('win-prize-text').innerText = randomPrize.text;
            document.getElementById('win-result-box').style.display = 'block';
        }, 4000);
    }
</script>
</body>
</html>
