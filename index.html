<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Armani Analetik.kz</title>
    
    <!-- 🟢 БРАУЗЕР ТАРИХЫ МЕН ВКЛАДКАҒА АРНАЛҒАН "AV" FAVICON ЛОГОТИПІ -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230a0c0a'/><path d='M25 75 L42 25 L58 25 L40 75 Z' fill='%232ecc71'/><path d='M42 25 L75 75 L60 75 L50 58 L62 58 L54 44 Z' fill='%23f1c40f'/></svg>">

    <style>
        :root {
            --bg: #0a0c0a;
            --card: #121613;
            --accent: #2ecc71;
            --text: #ffffff;
            --subtext: #8a9a8e;
            --border: #1e2620;
            --gold: #f1c40f;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: var(--bg); 
            color: var(--text); 
            margin: 0; 
            padding: 0 0 80px 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }

        /* ⏳ PRELOADER */
        #preloader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        .preloader-logo-wrapper {
            position: relative;
            width: 90px;
            height: 90px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .preloader-spinner {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 3px solid rgba(46, 204, 113, 0.1);
            border-top: 3px solid var(--accent);
            border-right: 3px solid var(--gold);
            border-radius: 50%;
            animation: spin 1.2s linear infinite;
        }

        .preloader-logo {
            width: 45px;
            height: 45px;
            animation: pulse 1.5s ease-in-out infinite alternate;
        }

        .preloader-text {
            margin-top: 20px;
            font-size: 13px;
            font-weight: 700;
            color: var(--subtext);
            letter-spacing: 2px;
            text-transform: uppercase;
            animation: pulse 1.5s ease-in-out infinite alternate;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0% { transform: scale(0.92); opacity: 0.6; }
            100% { transform: scale(1.08); opacity: 1; }
        }

        .preloader-hidden {
            opacity: 0;
            visibility: hidden;
        }

        /* 🔝 HEADER & КІРУ/ТІРКЕЛУ БАТЫРМАЛАРЫ */
        header { 
            background: var(--card); 
            width: 100%; 
            padding: 12px 20px; 
            border-bottom: 1px solid var(--border); 
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-svg {
            width: 36px;
            height: 36px;
            filter: drop-shadow(0 0 8px rgba(46, 204, 113, 0.4));
        }

        .header-title-box h1 { margin: 0; font-size: 16px; font-weight: 800; color: var(--text); letter-spacing: 0.5px; }
        .header-title-box p { margin: 1px 0 0; color: var(--subtext); font-size: 11px; }

        .auth-buttons {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-login {
            background: transparent;
            color: var(--gold);
            border: 1px solid var(--gold);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-register {
            background: var(--gold);
            color: #000000;
            border: 1px solid var(--gold);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-login:active, .btn-register:active {
            opacity: 0.8;
            transform: scale(0.96);
        }

        /* 📱 МОДАЛЬДІ ТЕРЕЗЕ (КІРУ / ТІРКЕЛУ) */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(5px);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            width: 100%;
            max-width: 380px;
            padding: 24px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: var(--subtext);
            font-size: 20px;
            cursor: pointer;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 800;
            color: var(--accent);
            margin-bottom: 15px;
            text-align: center;
        }

        .input-group {
            margin-bottom: 12px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 11px;
            color: var(--subtext);
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 14px;
            outline: none;
        }

        .input-group input:focus {
            border-color: var(--accent);
        }

        .container { max-width: 500px; width: 92%; margin: 15px 0; }
        .card { 
            background: var(--card); 
            padding: 20px; 
            border-radius: 14px; 
            margin-bottom: 15px; 
            border: 1px solid var(--border); 
        }

        /* 🎁 КОНКУРС БЛОГЫ */
        .contest-box {
            background: rgba(46, 204, 113, 0.05);
            border: 1px solid var(--accent);
            border-radius: 12px;
            padding: 14px;
            text-align: center;
            margin-bottom: 15px;
            text-decoration: none;
            display: block;
            transition: transform 0.2s, background 0.2s;
        }
        .contest-box:active {
            transform: scale(0.98);
            background: rgba(46, 204, 113, 0.12);
        }
        .contest-title { 
            font-size: 16px; 
            font-weight: 800; 
            color: var(--accent); 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .contest-sub { 
            font-size: 12px; 
            color: var(--subtext); 
            margin-top: 4px; 
        }

        /* ⏱️ ТАЙМЕР БЛОГЫ */
        .btn-timer-container {
            margin-top: 15px;
            display: none;
            text-align: center;
            background: rgba(255, 255, 255, 0.03);
            border: 1px stroke var(--border);
            padding: 12px;
            border-radius: 10px;
        }
        .btn-timer-title { font-size: 11px; color: var(--subtext); text-transform: uppercase; letter-spacing: 1px; }
        .btn-timer-clock { font-size: 22px; font-weight: 800; color: var(--accent); margin-top: 3px; font-family: monospace; }

        .btn { 
            display: block; 
            background: var(--accent); 
            color: #000000; 
            padding: 15px; 
            text-decoration: none; 
            border-radius: 10px; 
            font-weight: 800; 
            text-align: center; 
            margin-top: 10px; 
            font-size: 15px; 
            border: none; 
            width: 100%; 
            cursor: pointer; 
        }
        .btn:active { opacity: 0.8; }
        .btn:disabled { 
            background: #2a352c; 
            color: #617365; 
            cursor: not-allowed; 
            opacity: 1; 
        }

        /* 🎡 SVG РУЛЕТКА */
        .wheel-wrapper {
            position: relative;
            width: 320px;
            height: 320px;
            margin: 15px auto;
            border-radius: 50%;
            border: 6px solid var(--accent);
            box-shadow: 0 0 30px rgba(46, 204, 113, 0.3);
            background: #000;
        }
        
        .wheel-pointer {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-top: 24px solid #ffffff;
            z-index: 30;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
        }

        .wheel-center-ribbon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 65px;
            height: 65px;
            background: #0c0f0d;
            border-radius: 50%;
            border: 3px solid var(--gold);
            z-index: 20;
            box-shadow: 0 0 12px rgba(241, 196, 15, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .wheel-center-ribbon svg {
            width: 28px;
            height: 28px;
        }

        .wheel-center-text {
            color: var(--gold);
            font-size: 7px;
            font-weight: 900;
            letter-spacing: 0.5px;
            margin-top: 1px;
        }

        .wheel-svg {
            width: 100%;
            height: 100%;
            transform-origin: center center;
            transition: transform 4s cubic-bezier(0.15, 0.9, 0.15, 1);
        }

        .sector-text {
            font-size: 13.5px;
            font-weight: 800;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-anchor: middle;
            dominant-baseline: central;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 60px;
            background: var(--card);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }
        .nav-item { color: var(--subtext); text-decoration: none; font-size: 12px; font-weight: 600; background: none; border: none; }
        .nav-item.active { color: var(--accent); }
    </style>
</head>
<body>

<!-- ⏳ PRELOADER -->
<div id="preloader">
    <div class="preloader-logo-wrapper">
        <div class="preloader-spinner"></div>
        <svg class="preloader-logo" viewBox="0 0 100 100">
            <path d="M25 75 L42 25 L58 25 L40 75 Z" fill="#2ecc71"/>
            <path d="M42 25 L75 75 L60 75 L50 58 L62 58 L54 44 Z" fill="#f1c40f"/>
        </svg>
    </div>
    <div class="preloader-text">Жүктелуде...</div>
</div>

<!-- 🔝 HEADER (Логотип + Кіру / Тіркелу) -->
<header>
    <div class="header-left">
        <svg class="logo-svg" viewBox="0 0 100 100">
            <rect width="100" height="100" rx="20" fill="#121613" stroke="#2ecc71" stroke-width="4"/>
            <path d="M25 75 L42 25 L58 25 L40 75 Z" fill="#2ecc71"/>
            <path d="M42 25 L75 75 L60 75 L50 58 L62 58 L54 44 Z" fill="#f1c40f"/>
        </svg>
        <div class="header-title-box">
            <h1>ARMANI ANALETIK</h1>
            <p>Минимализм & Аналитика</p>
        </div>
    </div>
    <div class="auth-buttons">
        <button class="btn-login" onclick="openModal('login')">Кіру</button>
        <button class="btn-register" onclick="openModal('register')">Тіркелу</button>
    </div>
</header>

<!-- 📱 КІРУ МЕН ТІРКЕЛУ МОДАЛЬДІ ТЕРЕЗЕСІ -->
<div class="modal-overlay" id="authModal">
    <div class="modal-card">
        <button class="modal-close" onclick="closeModal()">✕</button>
        <div class="modal-title" id="modalTitle">КІРУ</div>
        
        <form onsubmit="handleAuth(event)">
            <div class="input-group">
                <label>Телефон немесе Е-mail</label>
                <input type="text" placeholder="+7 (700) 000-00-00" required>
            </div>
            <div class="input-group">
                <label>Құпия сөз</label>
                <input type="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn" style="margin-top: 20px;">РАСТАУ</button>
        </form>
    </div>
</div>

<div class="container">

    <!-- 🎁 БҮГІН КОНКУРС СІЛТЕМЕСІ -->
    <a href="https://t.me/analetik_1" class="contest-box" target="_blank">
        <div class="contest-title">🎁 БҮГІНГІ КОНКУРС</div>
        <div class="contest-sub">Каналға өтіп, конкурсқа қатысыңыз! 🚀</div>
    </a>

    <div class="card" style="text-align: center;">
        <h2 style="font-size: 18px; margin: 0 0 10px 0; color: var(--accent);">🎯 СӘТТІЛІК РУЛЕТКАСЫ</h2>

        <div class="wheel-wrapper">
            <div class="wheel-pointer"></div>
            
            <div class="wheel-center-ribbon">
                <svg viewBox="0 0 100 100">
                    <path d="M25 75 L42 25 L58 25 L40 75 Z" fill="#2ecc71"/>
                    <path d="M42 25 L75 75 L60 75 L50 58 L62 58 L54 44 Z" fill="#f1c40f"/>
                </svg>
                <div class="wheel-center-text">ANALYTICS</div>
            </div>

            <svg class="wheel-svg" id="wheel" viewBox="0 0 500 500">
                <g id="sectors-group"></g>
            </svg>
        </div>

        <audio id="spin-sound" src="https://cdn.pixabay.com/audio/2022/03/15/audio_2c9d81d6d6.mp3" preload="auto"></audio>
        <audio id="win-sound" src="https://cdn.pixabay.com/audio/2023/10/16/audio_d0b57e4e67.mp3" preload="auto"></audio>

        <!-- ⏱️ БАТЫРМА ҮСТІНДЕГІ КЕРІ САНАҚ -->
        <div class="btn-timer-container" id="timer-container">
            <div class="btn-timer-title">⏱️ Келесі айналдыруға дейін:</div>
            <div class="btn-timer-clock" id="countdown-timer">23:59:59</div>
        </div>

        <button id="spin-btn" onclick="spinWheel()" class="btn">🎰 АЙНАЛДЫРУ</button>

        <div id="win-result-box" style="display: none; margin-top: 15px; background: rgba(46,204,113,0.1); border: 1px solid var(--accent); padding: 12px; border-radius: 8px;">
            <div style="font-size: 12px; color: var(--subtext);">Сіздің жүлдеңіз:</div>
            <div id="win-prize-text" style="font-size: 18px; font-weight: 800; color: var(--accent); margin: 5px 0;">—</div>
            <a href="https://t.me/analetik_1" class="btn" style="background: #ffffff; color: #000;">ЖҮЛДЕНІ АЛУ (TELEGRAM)</a>
        </div>
    </div>

</div>

<nav class="bottom-nav">
    <button class="nav-item active">Басты бет</button>
    <button class="nav-item">VIP Зона</button>
    <button class="nav-item">Рулетка</button>
</nav>

<script>
    // PRELOADER
    window.addEventListener('load', () => {
        const preloader = document.getElementById('preloader');
        setTimeout(() => {
            preloader.classList.add('preloader-hidden');
        }, 800);
    });

    // 📱 МОДАЛЬДІ ТЕРЕЗЕ БАСҚАРУ
    function openModal(type) {
        const modal = document.getElementById('authModal');
        const title = document.getElementById('modalTitle');
        title.innerText = type === 'login' ? 'САЙТҚА КІРУ' : 'ТІРКЕЛУ';
        modal.style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('authModal').style.display = 'none';
    }

    function handleAuth(e) {
        e.preventDefault();
        alert("Сәтті орындалды!");
        closeModal();
    }

    // ⏱️ Кері санақ таймері
    let timerInterval = null;
    function startTimer() {
        let totalSeconds = 24 * 3600 - 1;
        const timerElement = document.getElementById('countdown-timer');
        
        if (timerInterval) clearInterval(timerInterval);
        
        timerInterval = setInterval(() => {
            let hours = Math.floor(totalSeconds / 3600);
            let minutes = Math.floor((totalSeconds % 3600) / 60);
            let seconds = totalSeconds % 60;

            hours = hours < 10 ? '0' + hours : hours;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            seconds = seconds < 10 ? '0' + seconds : seconds;

            timerElement.innerText = `${hours}:${minutes}:${seconds}`;
            if (totalSeconds > 0) totalSeconds--;
            else totalSeconds = 24 * 3600;
        }, 1000);
    }

    // 🎡 ЖҮЛДЕЛЕР
    const prizes = [
        { text: "VIP Экспресс -10% 🔥", bg: "#ffffff", color: "#000000" },
        { text: "VIP Канал +1 Күн 👑", bg: "#2ecc71", color: "#000000" },
        { text: "VIP 15% Жеңілдік 💎", bg: "#121613", color: "#ffffff" },
        { text: "Қайта Айналдыру 🔄", bg: "#ffffff", color: "#000000" },
        { text: "VIP 25% Жеңілдік 🚀", bg: "#2ecc71", color: "#000000" },
        { text: "VIP +3 Күн 🎉", bg: "#121613", color: "#ffffff" },
        { text: "VIP Айлық +15 Күн 🏆", bg: "#ffffff", color: "#000000" }
    ];

    function buildWheel() {
        const group = document.getElementById('sectors-group');
        const numSectors = prizes.length;
        const arc = 360 / numSectors;
        const radius = 245;
        const centerX = 250;
        const centerY = 250;

        prizes.forEach((prize, i) => {
            const startAngle = i * arc - 90;
            const endAngle = startAngle + arc;

            const startRad = (startAngle * Math.PI) / 180;
            const endRad = (endAngle * Math.PI) / 180;

            const x1 = centerX + radius * Math.cos(startRad);
            const y1 = centerY + radius * Math.sin(startRad);
            const x2 = centerX + radius * Math.cos(endRad);
            const y2 = centerY + radius * Math.sin(endRad);

            const pathData = `M ${centerX} ${centerY} L ${x1} ${y1} A ${radius} ${radius} 0 0 1 ${x2} ${y2} Z`;

            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            path.setAttribute("d", pathData);
            path.setAttribute("fill", prize.bg);
            path.setAttribute("stroke", "rgba(0,0,0,0.15)");
            path.setAttribute("stroke-width", "2");
            group.appendChild(path);

            const midAngle = startAngle + arc / 2;
            const textRad = (midAngle * Math.PI) / 180;
            const textDist = 145;
            const textX = centerX + textDist * Math.cos(textRad);
            const textY = centerY + textDist * Math.sin(textRad);

            const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
            text.setAttribute("x", textX);
            text.setAttribute("y", textY);
            text.setAttribute("fill", prize.color);
            text.setAttribute("class", "sector-text");
            text.setAttribute("transform", `rotate(${midAngle + 90}, ${textX}, ${textY})`);
            text.textContent = prize.text;

            group.appendChild(text);
        });
    }

    buildWheel();

    // 🎡 Айналдыру
    let isSpinning = false;
    let currentRotation = 0;

    function spinWheel() {
        if (isSpinning) return;

        isSpinning = true;
        const btn = document.getElementById('spin-btn');
        btn.disabled = true;
        document.getElementById('win-result-box').style.display = 'none';

        const spinSound = document.getElementById('spin-sound');
        const winSound = document.getElementById('win-sound');

        spinSound.currentTime = 0;
        spinSound.play().catch(() => {});

        const numSectors = prizes.length;
        const arc = 360 / numSectors;
        
        const prizeIndex = Math.floor(Math.random() * numSectors);
        const selectedPrize = prizes[prizeIndex];

        const targetSectorAngle = (prizeIndex * arc) + (arc / 2);
        const targetDegree = 360 - targetSectorAngle;

        currentRotation += (360 * 5) + (targetDegree - (currentRotation % 360));

        document.getElementById('wheel').style.transform = `rotate(${currentRotation}deg)`;

        setTimeout(() => {
            isSpinning = false;

            spinSound.pause();
            winSound.currentTime = 0;
            winSound.play().catch(() => {});

            document.getElementById('win-prize-text').innerText = selectedPrize.text;
            document.getElementById('win-result-box').style.display = 'block';

            btn.innerText = "КЕЗЕКТІ АЙНАЛДЫРУ ШЕКТЕЛДІ 🔒";
            document.getElementById('timer-container').style.display = 'block';
            startTimer();

        }, 4000);
    }
</script>
</body>
</html>
